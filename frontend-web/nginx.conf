# =============================================================================
# ShopPilot AI —— frontend-web 容器内静态托管（SPA fallback）
# =============================================================================
# 由 Dockerfile 复制到容器内 /etc/nginx/conf.d/default.conf。
#
# ★ M2-T12 修复（M1 骨架遗留缺陷）：M1 骨架沿用 nginx 官方默认配置，
#   `location /` 没有 `try_files`，因此对 history 模式路由的**深链**——
#   `/login`、`/catalog/products`、`/catalog/warehouses` 等——直接返回 404
#   （请求 `/catalog/products` 会去找同名静态文件，不存在即 404）。
#   这会让「刷新页面 / 书签 / 直接输入 URL」全部失效，也使 M2-T12 的
#   逐页走查（未登录访问 /catalog/products → 跳 /login）无法通过 nginx 复现。
#
#   修法：未命中静态资源的请求一律回落到 index.html，交由前端路由处理。
#   注：仅影响 frontend-web 静态层；未新增任何依赖，未改 nginx 反向代理与 API 链路。
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 产物中带内容 hash 的资源可长缓存（文件名变化即缓存失效）
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 其余请求：静态文件优先，未命中一律回落 index.html（SPA 深链 / 刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
