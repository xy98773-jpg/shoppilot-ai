# =============================================================================
# ShopPilot AI —— CI（M1-T11）
# =============================================================================
# 三段构建/测试 + 一段端到端冒烟：
#   backend     Java 21 + mvn verify（ArchUnit 2/2 + MySQL 版本守卫 Testcontainers 负向测试）
#   frontend    Node 22 + npm ci && npm run build（vue-tsc 类型检查 + vite 构建）
#   service-ai  Python 3.13 + pip install -e ".[dev]" && pytest
#   smoke        docker compose 起 dev 栈 → 探活 /api/v1/health → 断言 service-ai 不暴露
#
# 依据：
#   TECH_STACK.md        —— Java 21 / Node 22 / Python 3.13；Testcontainers 用于版本守卫负向测试
#   DEVELOPMENT_PLAN:205 —— 版本守卫阻断须有可重复 CI（对应 M1-T05 手工 3308 取证）
#   PROJECT_STRUCTURE §7.1 —— service-ai 绝不暴露（冒烟中 curl :8000 必须失败）
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # backend-java：构建 + 单元/集成测试（无需额外 service container；
  # 版本守卫负向测试由 Testcontainers 在作业内自起 mysql:8.0.12，GitHub 运行器自带 Docker）
  # ---------------------------------------------------------------------------
  backend:
    name: backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -DskipTests=false verify

  # ---------------------------------------------------------------------------
  # frontend-web：类型检查 + 生产构建（package.json 无 test 脚本，build 已含 vue-tsc）
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install & build
        run: npm ci && npm run build

  # ---------------------------------------------------------------------------
  # service-ai：Python 依赖安装 + pytest
  # ---------------------------------------------------------------------------
  service-ai:
    name: service-ai (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install & test
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  # ---------------------------------------------------------------------------
  # smoke：端到端起 dev 栈（Docker Compose），探活后断言 service-ai 不暴露
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (docker compose)
    needs: [backend, frontend, service-ai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start dev stack
        run: docker compose -f deploy/docker-compose.dev.yml up -d --build

      - name: Wait for /api/v1/health
        run: |
          timeout 300 bash -c '
            until curl -fsS http://localhost/api/v1/health >/dev/null 2>&1; do
              sleep 5
            done
          '

      - name: Probe endpoints
        run: |
          echo "== /api/v1/health (expect 200) =="
          curl -fsS http://localhost/api/v1/health
          echo
          echo "== / (expect 200) =="
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost/
          echo "== service-ai :8000 必须不可达（expect 失败） =="
          if curl -fsS --max-time 5 http://localhost:8000/ >/dev/null 2>&1; then
            echo "ERROR: service-ai 暴露在宿主 8000，违反 PROJECT_STRUCTURE §7.1 / NFR-SEC-04"
            docker compose -f deploy/docker-compose.dev.yml logs
            exit 1
          fi
          echo "OK: service-ai 未暴露"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v
