spring:
  application:
    name: shoppilot-ai

  # M1-T05：数据源。凭据只从环境变量读取（CODING_STANDARDS.md：密钥不入仓），
  # 默认值仅为本地开发的占位口径，便于 M1-T09 Compose 用同一组变量注入。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shoppilot?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # M1-T05：Flyway 基线。本期只让 Flyway 建出 flyway_schema_history 并跑通迁移链，
  # 迁移目录内不含任何业务表 DDL（业务迁移自 M2-T01 起）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 按 DATABASE_DESIGN.md §9.5「全新环境（开发/CI）默认 baseline-on-migrate = false，
    # 从 V1 顺序执行到底」：指向非空库时直接报错，避免静默基线化并跳过 V1..Vn（结构漂移）。
    baseline-on-migrate: false
    # 校验和不符即启动失败（DATABASE_DESIGN.md §9.5：宁可起不来，不允许结构漂移）
    validate-on-migrate: true
    # 禁止 clean（同 §9.5 生产约束，开发环境亦收紧）
    clean-disabled: true

server:
  port: 8080

# M2-T06：多团队数据隔离（DESIGN_BASIS §6 规则 4/5）。
# 启用后 TenantLineInnerInterceptor 对所有含 team_id 的表自动追加/补齐 team_id 条件
# （users / teams 是 §6 规则 1 的显式例外表，由 ShopPilotTenantLineHandler.ignoreTable 排除）。
# 上下文缺失时**拒绝查询**（AUTH-1001），不再退化为哨兵 team_id = 0。
shoppilot:
  multitenancy:
    enabled: true

# M1-T06：Actuator 健康检查（TECH_STACK.md：Micrometer + Actuator，NFR-OBS）。
# 暴露面最小化：仅 health 与 info；env / beans / configprops / loggers / threaddump /
# heapdump / shutdown 等敏感端点一律不暴露（暴露列表即白名单，未列出者不可达）。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不向调用方泄露健康组件细节（数据源地址、磁盘路径等）
      show-details: never
