# =============================================================================
# ShopPilot AI —— 对外 nginx（唯一公网入口，SYSTEM_ARCHITECTURE.md §8.1）
# =============================================================================
# 由 compose 挂载到容器内 /etc/nginx/conf.d/default.conf
#
# 路由（对应 SYSTEM_ARCHITECTURE §8 部署视图）：
#   /            → frontend-web:80   （SPA 静态资源）
#   /api/        → backend-java:8080 （REST API）
#   /internal/** → 不代理；service-ai 绝不暴露（§8.1 / NFR-SEC-04 AC :83）
# =============================================================================

server {
    listen 80;
    server_name _;

    # 资料导入等上传请求的体量上限
    client_max_body_size 32m;

    # ---- REST API：反向代理到 backend-java ----
    location /api/ {
        proxy_pass http://backend-java:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 链路追踪：透传/生成 X-Request-Id（SYSTEM_ARCHITECTURE §8.2-3）
        proxy_set_header X-Request-Id      $request_id;
    }

    # ---- 静态资源：SPA 交由 frontend-web 容器托管 ----
    location / {
        proxy_pass http://frontend-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
