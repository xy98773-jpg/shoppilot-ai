# =============================================================================
# ShopPilot AI —— 对外 nginx（唯一公网入口，SYSTEM_ARCHITECTURE.md §8.1）
# =============================================================================
# 由 compose 挂载到容器内 /etc/nginx/conf.d/default.conf
#
# 路由（对应 SYSTEM_ARCHITECTURE §8 部署视图）：
#   /            → frontend-web:80   （SPA 静态资源）
#   /api/        → backend-java:8080 （REST API）
#   /internal/** → 不代理；service-ai 绝不暴露（§8.1 / NFR-SEC-04 AC :83）
# ★ 动态 DNS 解析（2026-10-16 修复 nginx 502 Bad Gateway）：
#   Docker 内嵌 DNS 位于 127.0.0.11。proxy_pass 若写字面量主机名，nginx 仅在【启动时】
#   解析一次并缓存 IP；当被依赖容器（frontend-web / backend-java）重建导致 IP 变化后，
#   nginx 仍连旧 IP → connect() failed (111: Connection refused) → 502。
#   故统一改为「resolver + 变量 proxy_pass」，使上游地址按 valid=10s 动态重解析。
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# ★ R190（M7-T04 发现）：链路追踪头的「透传优先、缺失才生成」。
#   API_CONTRACT §7 原文：「客户端可传入用于跨系统排查；未传时服务端生成」。
#   旧写法 `proxy_set_header X-Request-Id $request_id;` 无条件覆盖客户端值，
#   使跨系统排查（网关/前端/压测工具传入的 id）在 nginx 处断链。改为 map：
#     客户端传了（非空）⇒ 原样透传；没传 ⇒ 用 nginx 的 $request_id 生成。
#   形态校验仍由后端 RequestIdContext.ACCEPTABLE（^[A-Za-z0-9_.-]{1,128}$）兜底，
#   非法值会被后端替换为 req_<32hex>，因此透传不引入日志注入风险。
map $http_x_request_id $shoppilot_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    # 资料导入等上传请求的体量上限
    client_max_body_size 32m;

    # ---- REST API：反向代理到 backend-java ----
    location /api/ {
        set $backend_upstream backend-java;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 链路追踪：透传/生成 X-Request-Id（SYSTEM_ARCHITECTURE §8.2-3）
        proxy_set_header X-Request-Id      $shoppilot_request_id;
        # ★ R193（M7-T02 实测）：确认导入是【长事务】接口。NFR-PERF-02 的门槛就是
        #   1 万行 < 60s，而 nginx 默认 proxy_read_timeout 恰好是 60s ⇒ 合法导入会在
        #   服务端即将返回时被网关切断，客户端拿到 504，看不到已成功的结果。
        #   （服务端事务不会因客户端断开而回滚，故调大超时不引入「半提交」风险。）
        #   300s = 60s 门槛 × 5 的余量：既覆盖上限边缘，又不至于让真死请求挂太久。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 静态资源：SPA 交由 frontend-web 容器托管 ----
    location / {
        set $frontend_upstream frontend-web;
        proxy_pass http://$frontend_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
