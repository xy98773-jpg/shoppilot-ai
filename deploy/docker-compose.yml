# =============================================================================
# ShopPilot AI —— 集成 / 演示环境 Compose
# =============================================================================
# 依据：
#   SYSTEM_ARCHITECTURE.md §8    —— 自定义网络 shoppilot-net；nginx 唯一对外
#   SYSTEM_ARCHITECTURE.md §8.1  —— 端口暴露策略
#   SYSTEM_ARCHITECTURE.md §8.3  —— 集成/演示：仅 nginx 暴露 80，其余内网
#   PROJECT_STRUCTURE.md   §7.1  —— nginx ✅80；frontend-web/backend-java/service-ai/mysql ❌
#   ACCEPTANCE_CRITERIA.md :381  —— 四服务 healthy + Flyway 迁移成功
#   ACCEPTANCE_CRITERIA.md :405  —— 全新环境按文档执行即可达到
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml down          # 保留数据卷
#   docker compose -f deploy/docker-compose.yml down -v       # 连同数据卷删除
#
# 变量：可在 deploy/.env 覆盖（见 deploy/.env.example，M1-T10）。
#   未覆盖时使用下列【本地演示占位默认值】——真机部署务必用 .env 覆盖为真实值。
#
# ★ service-ai 绝不对外暴露端口（§8.1 / NFR-SEC-04）；仅本 compose 网络内可达。
# =============================================================================

name: shoppilot

services:
  # ---------------------------------------------------------------------------
  # MySQL（业务库，仅内网）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36 # TECH_STACK.md:151 固定小版本，禁止 mysql:8 浮动 tag
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shoppilot}
      MYSQL_USER: ${MYSQL_USER:-shoppilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --mysqlx=OFF
    volumes:
      - shoppilot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # service-ai（FastAPI，仅内网；绝不暴露端口）
  # ---------------------------------------------------------------------------
  service-ai:
    build:
      context: ../service-ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-changeme_internal_token}
      # M4-B14（R100）：Python 回调 Java 的地址。与 backend-java 的 AI_SERVICE_BASE_URL
      # 语义相反（后者是 Java 调 Python），故变量名刻意不同，不得混用。
      JAVA_BACKEND_BASE_URL: ${JAVA_BACKEND_BASE_URL:-http://backend-java:8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # backend-java（业务唯一写方，仅内网）
  # ★ 连库必须用服务名 mysql:3306；容器内 localhost 指向容器自身，会连不上
  # ---------------------------------------------------------------------------
  backend-java:
    build:
      context: ../backend-java
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shoppilot}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=UTC&connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-shoppilot}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-changeme_internal_token}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://service-ai:8000}
      # M4-B20.4.1（R143）：分析轮询 / timeout_at 超时扫描开关。
      # application.yml 默认 false 是为了护住 34+ 个 @SpringBootTest；部署侧**必须显式打开**，
      # 否则定时通道不装配，分析链路只能靠读时同步（R143 修复后该通道已可用，但兜底扫描仍需本开关）。
      ANALYSIS_POLL_ENABLED: ${ANALYSIS_POLL_ENABLED:-true}
      # M2-T02：JWT 签名密钥（DESIGN_BASIS §15 D-01 / ADR-001-12 风险表：密钥绝不入业务代码）。
      # 集成交付必须通过环境变量注入真实密钥（此默认值仅为占位，禁止用于生产）。
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_jwt_secret_min_32_chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-7200}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
    depends_on:
      mysql:
        condition: service_healthy
      service-ai:
        condition: service_started
    volumes:
      - shoppilot-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # frontend-web（Vue SPA 静态托管，仅内网）
  # ---------------------------------------------------------------------------
  frontend-web:
    build:
      context: ../frontend-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # nginx（唯一对外入口）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-web:
        condition: service_started
      backend-java:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [shoppilot-net]

networks:
  shoppilot-net:
    driver: bridge

volumes:
  shoppilot-mysql-data:
  shoppilot-uploads:
