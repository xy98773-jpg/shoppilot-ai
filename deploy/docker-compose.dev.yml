# =============================================================================
# ShopPilot AI —— 开发环境 Compose
# =============================================================================
# 状态（2026-10-15）：**增量文件**。当前仅含 `mysql` 服务，用于提供本地开发数据库；
#   其余服务（nginx / frontend-web / backend-java / service-ai）由 M1-T09 补齐。
#
# 依据（SSOT 为准）：
#   PROJECT_STRUCTURE.md §7     —— `deploy/docker-compose.dev.yml`：开发环境用，暴露 3306 / 8080
#   PROJECT_STRUCTURE.md §7.1   —— `mysql` 主机暴露（开发态）✅ 3306；`service-ai` 绝不暴露
#   PROJECT_STRUCTURE.md §7.2   —— 必需环境变量 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD
#   TECH_STACK.md:151           —— 必须固定小版本 tag（如 mysql:8.0.36），禁止 mysql:8 浮动 tag
#   DATABASE_CONSTRAINTS.md C-11—— 必须 ≥ 8.0.16，否则 CHECK 约束被静默忽略
#
# 用法：
#   docker compose -f deploy/docker-compose.dev.yml up -d       # 启动
#   docker compose -f deploy/docker-compose.dev.yml ps          # 状态
#   docker compose -f deploy/docker-compose.dev.yml down        # 停止（保留数据卷）
#   docker compose -f deploy/docker-compose.dev.yml down -v     # 停止并删除数据卷（清库）
#
# 连接：jdbc:mysql://127.0.0.1:3306/shoppilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
# =============================================================================

name: shoppilot-dev

services:
  mysql:
    # 固定小版本：与 CI/本地验证口径一致（TECH_STACK.md:151 禁止浮动 tag）
    image: mysql:8.0.36
    container_name: shoppilot-mysql
    restart: unless-stopped
    environment:
      # 以下均为【本地开发默认值】，可用环境变量或 .env 覆盖（.env.example 见 M1-T10）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shoppilot_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shoppilot}
      MYSQL_USER: ${MYSQL_USER:-shoppilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shoppilot_dev}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 时间戳统一 UTC（DATABASE_DESIGN.md：DATETIME(3) 存 UTC）
      - --default-time-zone=+00:00
      - --mysqlx=OFF
    ports:
      # 仅开发态暴露（§7.1）；集成/演示态由 docker-compose.yml 收敛
      - "3306:3306"
    volumes:
      - shoppilot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  shoppilot-mysql-data:
