# =============================================================================
# ShopPilot AI —— 开发环境 Compose
# =============================================================================
# 依据：
#   SYSTEM_ARCHITECTURE.md §8    —— 自定义网络 shoppilot-net；nginx 唯一对外
#   SYSTEM_ARCHITECTURE.md §8.1  —— 端口暴露策略
#   SYSTEM_ARCHITECTURE.md §8.3  —— 开发：MySQL 暴露 3306、Java 暴露 8080
#   PROJECT_STRUCTURE.md   §7    —— deploy/docker-compose.dev.yml
#   PROJECT_STRUCTURE.md   §7.1  —— nginx ✅80；backend-java ✅8080；mysql ✅3306；
#                                   frontend-web ❌；service-ai ❌【绝不暴露】
#   TECH_STACK.md:151            —— 镜像固定小版本 tag（禁 mysql:8 浮动）
#   ACCEPTANCE_CRITERIA.md :80   —— `docker compose ps` → mysql/backend-java/service-ai/nginx 均 healthy
#   ACCEPTANCE_CRITERIA.md :82   —— backend-java 容器内 `curl service-ai:8000/internal/v1/health` → UP
#   ACCEPTANCE_CRITERIA.md :83   —— 宿主 `curl localhost:8000` → 连接失败
#
# 用法：
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#   docker compose -f deploy/docker-compose.dev.yml ps
#   docker compose -f deploy/docker-compose.dev.yml down          # 保留数据卷
#   docker compose -f deploy/docker-compose.dev.yml down -v       # 连同数据卷删除（清库）
#
# 变量：可在 deploy/.env 覆盖（见 deploy/.env.example，M1-T10）。
#   未覆盖时使用下列【本地开发占位默认值】——仅供本机 dev，不具备任何安全性。
#
# ★ service-ai 绝不对外暴露端口（§8.1 / NFR-SEC-04）；仅本 compose 网络内可达。
# =============================================================================

name: shoppilot-dev

services:
  # ---------------------------------------------------------------------------
  # MySQL（业务库；开发态暴露 3306，便于宿主 DataGrip / CLI 直连）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36 # TECH_STACK.md:151 固定小版本，禁止浮动 tag
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shoppilot}
      MYSQL_USER: ${MYSQL_USER:-shoppilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 时间戳统一 UTC（DATABASE_DESIGN.md：DATETIME(3) 存 UTC）
      - --default-time-zone=+00:00
      - --mysqlx=OFF
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - shoppilot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # service-ai（FastAPI；仅内网，绝不暴露端口）
  # ---------------------------------------------------------------------------
  service-ai:
    build:
      context: ../service-ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-changeme_internal_token}
      # M4-B14（R100）：Python 回调 Java 的地址。与 backend-java 的 AI_SERVICE_BASE_URL
      # 语义相反（后者是 Java 调 Python），故变量名刻意不同，不得混用。
      JAVA_BACKEND_BASE_URL: ${JAVA_BACKEND_BASE_URL:-http://backend-java:8080}
      # M8-T07（R155）：LLM 接入（OpenAI 兼容；默认 DeepSeek）。★ 与生产 compose 同口径。
      #   LLM_API_KEY 故意不留默认值——密钥只能由宿主注入（读 deploy/.env）。
      #   未配置时 LLM 步骤按 SKIPPED 降级，规则结果照常返回，run 不会失败。
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # backend-java（业务唯一写方；开发态暴露 8080）
  # ★ 连库必须用服务名 mysql:3306；容器内 localhost 指向容器自身，会连不上
  # ---------------------------------------------------------------------------
  backend-java:
    build:
      context: ../backend-java
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shoppilot}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=UTC&connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-shoppilot}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1536m}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-changeme_internal_token}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://service-ai:8000}
      # M4-B20.4.1（R143）：分析轮询 / timeout_at 超时扫描开关。
      # application.yml 默认 false 是为了护住 34+ 个 @SpringBootTest；开发态显式打开。
      ANALYSIS_POLL_ENABLED: ${ANALYSIS_POLL_ENABLED:-true}
      # M2-T02：JWT 签名密钥（DESIGN_BASIS §15 D-01 / ADR-001-12 风险表：密钥绝不入业务代码）。
      # 本地开发默认值仅为占位；生产/CI 必须通过环境变量覆盖（密钥不得入仓）。
      JWT_SECRET: ${JWT_SECRET:-dev-only-placeholder-jwt-secret-change-me-32bytes}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-7200}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      service-ai:
        condition: service_started
    volumes:
      - shoppilot-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # frontend-web（Vue SPA 静态托管；仅内网，经 nginx 访问）
  # ---------------------------------------------------------------------------
  frontend-web:
    build:
      context: ../frontend-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [shoppilot-net]

  # ---------------------------------------------------------------------------
  # nginx（唯一对外入口）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-web:
        condition: service_started
      backend-java:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [shoppilot-net]

networks:
  shoppilot-net:
    driver: bridge

volumes:
  shoppilot-mysql-data:
  shoppilot-uploads:
